name: Build Project

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-

      - name: Build Project
        run: npm run build

      - name: Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
