name: Deploy React + Vite to GH Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main"
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build Project
        run: npm run build

  build-deploy:
    runs-on: ubuntu-latest
    if: always()  # Джоба всегда создаётся, но ждёт ручного запуска
    environment: staging  # Требует ручного подтверждения
    steps:
      # Checkout the specified branch (for manual runs)
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build
      - name: Build
        run: npm run build

      # Deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
